plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'pinkok_backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    // 폰 푸시 알림(FCM) 발송
    implementation 'com.google.firebase:firebase-admin:9.11.0'
    // 배포 서버(Cloud Run)의 사진·영상 저장소 (Cloud Storage). firebase-admin 이 쓰는 버전과 맞춘다
    implementation 'com.google.cloud:google-cloud-storage:2.73.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Cloud Run -> Cloud SQL 연결(cloudSqlInstance 옵션을 쓸 때만 동작, 로컬 실행에는 영향 없음)
    runtimeOnly 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.21.0'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 테스트에서 진짜 Cloud Storage 대신 메모리에서 흉내 내는 가짜 저장소 (google-cloud-storage 2.73.0 과 짝)
    testImplementation 'com.google.cloud:google-cloud-nio:0.137.0'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 가능한 jar(bootJar) 하나만 만든다. 일반 jar(-plain.jar)가 같이 생기면
// Dockerfile 의 build/libs/*.jar 복사가 두 파일을 잡아 실패한다.
jar {
    enabled = false
}
