# 통합 테스트용 설정 - H2 인메모리 DB (MySQL 불필요)
spring.datasource.url=jdbc:h2:mem:pinkok_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-that-is-definitely-long-enough-for-hs256-algorithm
jwt.access-token-validity=3600000

# 테스트에서는 KakaoLocalApiClient 를 Mockito로 대체하므로 실제 키가 필요 없다.
# (application.properties 는 git에 커밋되지 않는 파일이라, 그게 없는 환경/CI에서도
#  테스트가 돌아가려면 여기 기본값이 있어야 한다.)
kakao.rest-api-key=test-dummy-key
kakao.local-api-base-url=https://dapi.kakao.com
